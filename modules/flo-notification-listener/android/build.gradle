plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// Uses the expo-module-gradle-plugin form, not the legacy
// `apply from: ExpoModulesCorePlugin.gradle`, which fails on Gradle 8.14 with
// "Could not load compiled classes for script ... from cache" (same fix as
// scripts/patch-expo-share-intent.js). The plugin supplies the managed SDK
// versions and the core dependencies.
group = 'com.anonymous.flo.detect'
version = ''

android {
  namespace "com.anonymous.flo.detect"
  defaultConfig {
    versionCode 1
    versionName ""
  }
  lintOptions {
    abortOnError false
  }
}
